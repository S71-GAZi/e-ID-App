name: smart_card
description: "Smart Digital Visiting Card - create, share and collect digital business cards."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation (deep-link aware)
  go_router: ^14.2.7

  # Backend: Supabase (Postgres, Auth, Storage, RLS)
  supabase_flutter: ^2.5.6

  # QR generation + scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Deep links (Phase 3 adds branch_sdk)
  app_links: ^6.1.1

  # Local / offline storage
  drift: ^2.18.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Contacts export
  flutter_contacts: ^1.1.9+2

  # Image picking for card photo
  image_picker: ^1.1.2

  # Screen brightness boost on the QR screen
  wakelock_plus: ^1.2.8

  # Sharing (copy link, share sheet)
  share_plus: ^7.2.2

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
